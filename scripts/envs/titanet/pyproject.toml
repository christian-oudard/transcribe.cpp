[project]
name = "transcribe-titanet-env"
version = "0.1.0"
description = "Python env for TitaNet speaker embedding reference dumps via NeMo (EncDecSpeakerLabelModel)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Same NeMo pin as scripts/envs/sortformer and scripts/envs/parakeet.
    # TitaNet is EncDecSpeakerLabelModel, which has been stable in NeMo far
    # longer than the diarizers, so the pin is for consistency rather than
    # for a feature.
    "nemo-toolkit[asr] @ git+https://github.com/NVIDIA-NeMo/NeMo.git@6967f48fda2a",
    "torch>=2.2",
    "huggingface-hub>=0.20",
    "soundfile>=0.12",
    "numpy>=1.26",
    "gguf>=0.10.0",
    # The reference for a speaker embedding is not a transcript, so accuracy
    # is scored as equal error rate over verification trials rather than WER.
    "scikit-learn>=1.4",
]

# NeMo main maps torch by platform: darwin->pypi (CPU), linux->cu129,
# windows->cpu. Restrict to the two we actually run on so the resolver picks
# one torch source per split and the cpu/cu129 indexes do not collide.
[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
